# AppImage recipe, adapted from OpenEmux's (packaging/appimage/
# AppImageBuilder.yml), which explains each step. Phase 1 only: build.sh
# packs the AppDir with the static type2 runtime itself.
version: 1

script:
  - rm -rf AppDir appimage-builder-cache
  - mkdir -p AppDir/usr/bin AppDir/lib AppDir/runtime/compat/usr/lib64
  - ln -sfn runtime/compat/usr/lib64 AppDir/lib64
  - ln -sfn usr/lib64 AppDir/runtime/compat/lib64
  - sh packaging/common/stage.sh AppDir
  - rm AppDir/usr/bin/open-documents-viewer
  - gcc -static packaging/appimage/odv-launcher.c -O2 -s -o AppDir/usr/bin/odv-launcher
  - install -Dm755 packaging/appimage/odv-run.sh AppDir/usr/bin/odv-run
  - install -Dm755 packaging/appimage/gdk-pixbuf-query-loaders AppDir/usr/bin/gdk-pixbuf-query-loaders
  - ln -sf gdk-pixbuf-query-loaders AppDir/usr/bin/gdk-pixbuf-query-loaders-64
  - sed -i 's|^Exec=.*|Exec=open-documents-viewer %F|' AppDir/usr/share/applications/io.github.guilhermefeitosa66.OpenDocumentsViewer.desktop

AppDir:
  path: AppDir
  app_info:
    id: io.github.guilhermefeitosa66.OpenDocumentsViewer
    name: Open Documents Viewer
    icon: io.github.guilhermefeitosa66.OpenDocumentsViewer
    # Kept in step with src/odv/__init__.py; build.sh refuses a mismatch.
    version: "0.4.0"
    exec: usr/bin/odv-launcher
  runtime:
    env:
      GI_TYPELIB_PATH: "$APPDIR/usr/lib/x86_64-linux-gnu/girepository-1.0"
      GDK_PIXBUF_MODULEDIR: "$APPDIR/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders"
      GDK_PIXBUF_MODULE_FILE: "$APPDIR/usr/lib/x86_64-linux-gnu/gdk-pixbuf-2.0/2.10.0/loaders.cache"
      XDG_DATA_DIRS: "$APPDIR/usr/share:/usr/local/share:/usr/share"
  apt:
    arch: amd64
    sources:
      - sourceline: deb https://archive.ubuntu.com/ubuntu/ noble main universe
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
      - sourceline: deb https://archive.ubuntu.com/ubuntu/ noble-updates main universe
        key_url: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C"
    include:
      - python3
      - python3-gi
      - python3-gi-cairo
      - python3-cairo
      - python3-markdown-it
      - libgtk-4-1
      - libadwaita-1-0
      - libgtksourceview-5-0
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - gir1.2-gtksource-5
      - libgirepository-1.0-1
      - libglib2.0-0
      - libgdk-pixbuf-2.0-0
      - libgdk-pixbuf2.0-bin
      - shared-mime-info
      - hicolor-icon-theme
      - adwaita-icon-theme
      - librsvg2-2
      - librsvg2-common

AppImage:
  arch: x86_64
